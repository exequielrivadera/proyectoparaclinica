services:
  - type: web
    name: clinica-demo-sindicato
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --bind 0.0.0.0:$PORT
    plan: free
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: TIMEZONE
        value: America/Argentina/Buenos_Aires
      - key: DATABASE_PATH
        value: instance/clinica.sqlite3
      - key: HOST
        value: 0.0.0.0
      - key: RUN_SCHEDULER
        value: "true"
      - key: CORS_ORIGINS
        value: https://exequielrivadera.github.io,null,http://127.0.0.1:5500,http://localhost:5500,http://127.0.0.1:8000,http://localhost:8000
