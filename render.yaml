services:
  - type: web
    name: clinica-demo-sindicato
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --bind 0.0.0.0:$PORT
    plan: starter
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: TIMEZONE
        value: America/Argentina/Buenos_Aires
      - key: DATABASE_PATH
        value: /var/data/clinica.sqlite3
      - key: HOST
        value: 0.0.0.0
      - key: RUN_SCHEDULER
        value: "true"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USE_SSL
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
    disk:
      name: clinica-demo-data
      mountPath: /var/data
      sizeGB: 1
